<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Transit Pass UI Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="color.css">
    <meta name="apple-mobile-web-app-status-bar-style" content="#1d86d7">
    <meta name="theme-color" content="#1d86d7" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>

    <!-- Blue header background -->
    <div class="curved-background" id="curved-background"></div>

    <!-- Title -->
    <div class="header">
        Transit Pass UI Demo
    </div>

    <!-- Card -->
    <div class="card">

        <!-- Top content -->
        <div class="card-top">
            <div class="demo-notice">DEMO ONLY — NOT A VALID TICKET</div>
            <div class="qr" role="img" aria-label="Sample graphic; not a scannable code">
                <div class="qr-placeholder">
                    <span>SAMPLE</span>
                    <span>NOT SCANNABLE</span>
                </div>
            </div>
            <div class="tap">Illustrative placeholder only</div>
            <hr class="divider">
            <div class="interstate">SAMPLE ROUTE</div>
            <div class="details-row">
                <div class="month">SAMPLE<br>DATE</div>
                <div class="zone">
                    <div class="number">—</div>
                    <div class="text">SAMPLE ZONE</div>
                </div>
            </div>
        </div>

        <div class="progress" aria-label="Illustrative sample progress">
            <div class="progress-label">ILLUSTRATIVE SAMPLE PROGRESS</div>
            <div class="color-strip">
                <div class="color-block red"></div>
                <div class="color-block green"></div>
                <div class="color-block blue"></div>
            </div>
            <div class="progress-bar" aria-hidden="true"></div>
            <div class="expiry">Sample expiry display</div>
            <div class="validator">Demo interface — no ticket or travel value</div>
        </div>

    </div>
</body>

</html>
